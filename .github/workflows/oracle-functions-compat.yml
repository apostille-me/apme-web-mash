name: Oracle Functions compatibility

on:
  pull_request:
    paths:
      - "src/lambdas/**"
      - ".github/workflows/oracle-functions-compat.yml"
  push:
    branches: [main]
    tags:
      - "lambda-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-functions-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: "1.88.0"
  EXPECTED_FN_BINS: "heavy_document_render_fn heavy_case_export_fn"
  ARTIFACT_PREFIX: "apme-web-mash"
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  package-and-smoke-test:
    name: Oracle Functions ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            image_arch: amd64
            runner: ubuntu-24.04
            runner_machine: x86_64
            rust_target: x86_64-unknown-linux-musl
            expected_machine: 62
          - arch: arm64
            image_arch: arm64
            runner: ubuntu-24.04-arm
            runner_machine: aarch64
            rust_target: aarch64-unknown-linux-musl
            expected_machine: 183
    env:
      ARTIFACT_ARCH: ${{ matrix.arch }}
      IMAGE_ARCH: ${{ matrix.image_arch }}
      RUST_TARGET: ${{ matrix.rust_target }}
      EXPECTED_MACHINE: ${{ matrix.expected_machine }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        run: |
          set -euo pipefail
          actual="$(uname -m)"
          if [[ "$actual" != "${{ matrix.runner_machine }}" ]]; then
            echo "runner architecture $actual does not match ${{ matrix.runner_machine }}" >&2
            exit 1
          fi
          docker version

      - name: Install pinned toolchain and native musl support
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils \
            ca-certificates \
            jq \
            musl-tools
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" "$RUST_TARGET"
          rustc +"$RUSTUP_TOOLCHAIN" --version --verbose

      - name: Validate the seven-platform contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(
              Path("src/lambdas/platforms/serverless-platforms.v2.json").read_text(encoding="utf-8")
          )
          expected = {
              "aws-lambda",
              "google-cloud-run",
              "azure-functions",
              "knative",
              "openfaas",
              "ibm-code-engine",
              "oracle-functions",
          }
          actual = {item["id"] for item in contract["platforms"]}
          if actual != expected:
              raise SystemExit(f"platform contract mismatch: {sorted(actual)}")
          oracle = contract["oracleFn"]
          if oracle["requiredFormat"] != "http-stream":
              raise SystemExit("Oracle/Fn format drifted")
          if oracle["logicalStatusHeader"] != "Fn-Http-Status":
              raise SystemExit("Oracle/Fn logical status header drifted")
          if contract["security"]["nonRootUidByMode"]["oracleFn"] != 1000:
              raise SystemExit("Oracle/Fn UID must remain 1000")
          PY

      - name: Exercise real Fn binaries over the Unix-socket protocol
        run: |
          set -euo pipefail
          cargo +"$RUSTUP_TOOLCHAIN" test \
            --manifest-path src/lambdas/Cargo.toml \
            --locked \
            --no-default-features \
            --features http \
            --test oracle_fn_process \
            -- --nocapture

      - name: Build static Fn entrypoints
        id: build
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/oracle-functions-${ARTIFACT_ARCH}"
          mkdir -p "$output/functions"
          for binary in $EXPECTED_FN_BINS; do
            cargo +"$RUSTUP_TOOLCHAIN" build \
              --manifest-path src/lambdas/Cargo.toml \
              --locked \
              --release \
              --no-default-features \
              --features http \
              --target "$RUST_TARGET" \
              --bin "$binary"
            route="${binary%_fn}"
            install -D -m 0555 \
              "src/lambdas/target/${RUST_TARGET}/release/${binary}" \
              "$output/functions/${route}/function"
          done
          printf 'output=%s\n' "$output" >> "$GITHUB_OUTPUT"

      - name: Validate ELF architecture and static linkage
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import struct

          root = Path(os.environ["RUNNER_TEMP"]) / f"oracle-functions-{os.environ['ARTIFACT_ARCH']}" / "functions"
          expected_machine = int(os.environ["EXPECTED_MACHINE"])
          expected_routes = {name.removesuffix("_fn") for name in os.environ["EXPECTED_FN_BINS"].split()}
          binaries = sorted(root.glob("*/function"))
          found = {binary.parent.name for binary in binaries}
          if found != expected_routes:
              raise SystemExit(f"Fn binary set mismatch: found={sorted(found)} expected={sorted(expected_routes)}")

          for binary in binaries:
              data = binary.read_bytes()
              if data[:4] != b"\x7fELF" or data[4] != 2 or data[5] != 1:
                  raise SystemExit(f"not a 64-bit little-endian ELF: {binary}")
              machine = struct.unpack("<H", data[18:20])[0]
              if machine != expected_machine:
                  raise SystemExit(f"wrong ELF machine in {binary}: {machine} != {expected_machine}")
              phoff = struct.unpack("<Q", data[32:40])[0]
              phentsize = struct.unpack("<H", data[54:56])[0]
              phnum = struct.unpack("<H", data[56:58])[0]
              program_types = {
                  struct.unpack("<I", data[phoff + index * phentsize: phoff + index * phentsize + 4])[0]
                  for index in range(phnum)
              }
              if 3 in program_types:
                  raise SystemExit(f"Fn executable has a dynamic interpreter: {binary}")
          PY

      - name: Render Oracle Functions/Fn Project bundles
        id: bundle
        run: |
          set -euo pipefail
          root="${{ steps.build.outputs.output }}"
          mkdir -p "$root/bundles"
          for binary in $EXPECTED_FN_BINS; do
            route="${binary%_fn}"
            bundle="$root/bundles/$route"
            mkdir -p "$bundle"
            install -m 0555 "$root/functions/$route/function" "$bundle/function"
            cat > "$bundle/Dockerfile" <<'DOCKERFILE'
          FROM alpine:3.22 AS identity
          RUN addgroup -S -g 1000 fn \
            && adduser -S -D -H -u 1000 -G fn fn

          FROM scratch
          COPY --from=identity /etc/passwd /etc/passwd
          COPY --from=identity /etc/group /etc/group
          COPY --chmod=0555 function /function
          ENV FN_FORMAT=http-stream
          USER fn:fn
          ENTRYPOINT ["/function"]
          DOCKERFILE
            cat > "$bundle/func.yaml" <<YAML
          schema_version: 20180708
          name: ${route}
          version: 0.1.0
          runtime: docker
          entrypoint: /function
          memory: 256
          timeout: 120
          YAML
            cat > "$bundle/DEPLOYMENT.md" <<MARKDOWN
          # ${route} on Oracle Functions

          This bundle uses the Fn Project \\`http-stream\` contract. OCI Functions supplies
          \\`FN_LISTENER\` at invocation time and starts the container as UID/GID 1000.
          Publish one architecture-specific image, or combine the verified amd64 and arm64
          images into a multi-architecture manifest before choosing Generic_X86_ARM.
          MARKDOWN
            image="oracle-${route}:${ARTIFACT_ARCH}-${GITHUB_RUN_ID}"
            docker build \
              --platform "linux/${IMAGE_ARCH}" \
              --tag "$image" \
              "$bundle"
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$IMAGE_ARCH"
            test "$(docker image inspect --format '{{json .Config.Entrypoint}}' "$image")" = '["/function"]'
            test "$(docker image inspect --format '{{.Config.User}}' "$image")" = 'fn:fn'
            docker image inspect "$image" > "$bundle/image-inspect.json"
            docker save "$image" | gzip -n > "$bundle/${route}-oracle-functions-${ARTIFACT_ARCH}.docker.tar.gz"
            sha256sum "$bundle/function" "$bundle"/*.docker.tar.gz > "$bundle/SHA256SUMS"
          done

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / f"oracle-functions-{os.environ['ARTIFACT_ARCH']}"
          routes = sorted(path.name for path in (root / "bundles").iterdir() if path.is_dir())
          manifest = {
              "schemaVersion": "scintilla.run/oracle-functions-artifacts.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "sourceCommit": os.environ["SOURCE_SHA"],
              "architecture": os.environ["ARTIFACT_ARCH"],
              "ociArchitecture": os.environ["IMAGE_ARCH"],
              "fnFormat": "http-stream",
              "listener": "unix://<platform-provided-socket>",
              "runtime": "docker",
              "containerUser": "fn:fn",
              "containerUidGid": "1000:1000",
              "routes": routes,
          }
          (root / "MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2))
          PY
          printf 'output=%s\n' "$root" >> "$GITHUB_OUTPUT"

      - name: Publish Oracle Functions compatibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.ARTIFACT_PREFIX }}-oracle-functions-${{ matrix.arch }}-${{ env.SOURCE_SHA }}
          path: ${{ steps.bundle.outputs.output }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
