name: secrets-audit

# Keyless, fail-closed check that no plaintext secret can reach this repository.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  env-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Install pinned audit tools
        env:
          JUST_VERSION: 1.51.0
          JUST_SHA256: c8f085ca3e885723c341d06243fc291b5abfdc8bbe3b2c076b117de490387b59
          ORES_SOPS_COMMIT: bff3c916d1aa532c8fc48e1c40da5d6db59ba972
          ORES_SOPS_BLOB: e746935e85b5c9ff2869f63bb7191dfecf46328c
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            --output /tmp/just.tar.gz
          printf '%s  %s\n' "$JUST_SHA256" /tmp/just.tar.gz | sha256sum --check --strict
          tar --extract --gzip --file /tmp/just.tar.gz --directory /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/ORESoftware/ores-sops/${ORES_SOPS_COMMIT}/ores-sops" \
            --output /tmp/ores-sops
          test "$(git hash-object /tmp/ores-sops)" = "$ORES_SOPS_BLOB"
          sudo install -m 0755 /tmp/ores-sops /usr/local/bin/ores-sops

          just --version
          ores-sops --version

      - name: Audit encrypted-environment policy without decryption keys
        run: just env-check
