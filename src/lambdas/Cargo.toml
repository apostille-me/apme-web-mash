[package]
name = "scintilla-route-lambdas"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
publish = false

[features]
default = ["aws", "http"]
aws = ["dep:lambda_runtime"]
http = ["dep:axum"]

[dependencies]
axum = { version = "=0.8.4", optional = true, default-features = false, features = ["http1", "tokio"] }
lambda_runtime = { version = "=1.3.0", optional = true }
serde_json = "1.0"
tokio = { version = "1.46", features = ["macros", "net", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
