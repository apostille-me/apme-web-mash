[package]
name = "scintilla-route-lambdas"
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
publish = false
autobins = false

[features]
default = ["aws", "http"]
aws = ["dep:lambda_runtime"]
http = ["dep:axum"]

[dependencies]
axum = { version = "=0.8.4", optional = true, default-features = false, features = ["http1", "tokio"] }
lambda_runtime = { version = "=1.3.0", optional = true }
serde_json = "1.0"
tokio = { version = "1.46", features = ["macros", "net", "rt-multi-thread"] }

[[bin]]
name = "heavy_document_render"
path = "src/bin/heavy_document_render.rs"
required-features = ["aws"]

[[bin]]
name = "heavy_case_export"
path = "src/bin/heavy_case_export.rs"
required-features = ["aws"]

[[bin]]
name = "heavy_document_render_http"
path = "src/bin/heavy_document_render_http.rs"
required-features = ["http"]

[[bin]]
name = "heavy_case_export_http"
path = "src/bin/heavy_case_export_http.rs"
required-features = ["http"]

[[bin]]
name = "heavy_document_render_fn"
path = "src/bin/heavy_document_render_fn.rs"
required-features = ["http"]

[[bin]]
name = "heavy_case_export_fn"
path = "src/bin/heavy_case_export_fn.rs"
required-features = ["http"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
