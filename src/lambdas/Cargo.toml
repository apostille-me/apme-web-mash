[package]
name = "scintilla-route-lambdas"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
lambda_runtime = "=1.3.0"
serde_json = "1.0"
tokio = { version = "1.46", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
