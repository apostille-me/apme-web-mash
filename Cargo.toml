[package]
name = "apme-web-mash"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Maud + Axum + SeaORM + Supabase/PostgreSQL + HTMX + WebSocket web server for Apostille Me."
repository = "https://github.com/apostille-me/apme-web-mash"
publish = false

[dependencies]
axum = { version = "0.8", features = ["form", "ws"] }
futures-util = "0.3"
maud = { version = "0.27", features = ["axum"] }
sea-orm = { version = "2.0", features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
